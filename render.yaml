services:
  - type: web
    name: battlecode-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: WORKER_API_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GITHUB_DISPATCH_REPO
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: GITHUB_DISPATCH_REF
        value: main
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
